<!doctype html>

<body>
<title>Quantitative Analysis Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook study tool. Sticky chapter rail on the left, one reading column on the right.
   Progress is drawn as a graduated buret; the accent is phenolphthalein pink, the colour of an endpoint. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --sunk: #eceef5;
  --ink: #1c1b29;
  --muted: #5b5a70;
  --line: #d9dae6;
  --accent: #b3166b;
  --accent-ink: #ffffff;
  --accent-soft: #f8e3ef;
  --ok: #1d7650;
  --ok-soft: #e0f2e8;
  --bad: #b3401f;
  --bad-soft: #fbe7df;
  --tick: rgba(28, 27, 41, 0.28);
  --f-display: "Zilla Slab", "Rockwell", "Roboto Slab", Georgia, serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-1: 0.8125rem; --s0: 1rem; --s1: 1.125rem; --s2: 1.375rem; --s3: 1.875rem; --s4: 2.5rem;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13131b; --surface: #1c1b26; --sunk: #24232f; --ink: #ebeaf3; --muted: #a4a2b8; --line: #33323f;
    --accent: #f06aa9; --accent-ink: #1c0b14; --accent-soft: #3a1c2c;
    --ok: #62cf98; --ok-soft: #173126; --bad: #ff8d6b; --bad-soft: #3a2018; --tick: rgba(235, 234, 243, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13131b; --surface: #1c1b26; --sunk: #24232f; --ink: #ebeaf3; --muted: #a4a2b8; --line: #33323f;
  --accent: #f06aa9; --accent-ink: #1c0b14; --accent-soft: #3a1c2c;
  --ok: #62cf98; --ok-soft: #173126; --bad: #ff8d6b; --bad-soft: #3a2018; --tick: rgba(235, 234, 243, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: var(--s0); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { line-height: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.shell {
  max-width: 1120px; margin: 0 auto;
  display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px;
  padding-top: 28px;
}

/* ---------- chapter rail ---------- */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; display: grid; gap: 14px; }
.brand { display: grid; gap: 2px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--f-display); font-size: var(--s2); font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-size: var(--s-1); color: var(--muted); }
.chlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chlink {
  display: grid; grid-template-columns: 2.1em minmax(0, 1fr) auto; align-items: baseline; gap: 6px;
  padding: 6px 8px; border-radius: var(--r); text-decoration: none; color: var(--ink); font-size: 0.9375rem;
}
.chlink:hover { background: var(--sunk); }
.chlink[aria-current="page"] { background: var(--accent-soft); }
.chlink .n { font-family: var(--f-mono); color: var(--muted); font-size: var(--s-1); }
.chlink[aria-current="page"] .n { color: var(--accent); }
.chlink .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chlink .sc { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chlink .sc.full { color: var(--ok); }

/* ---------- main column ---------- */
main { min-width: 0; max-width: 760px; display: grid; gap: 28px; align-content: start; }
.eyebrow { font-family: var(--f-mono); font-size: var(--s-1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.lede { color: var(--muted); max-width: 62ch; }
.head { display: grid; gap: 10px; }
.head h1 { font-size: var(--s4); font-weight: 700; letter-spacing: -0.015em; }

/* buret progress meter */
.buret { display: grid; gap: 6px; }
.buret-tube {
  position: relative; height: 16px; border: 1.5px solid var(--ink); border-radius: 3px 8px 8px 3px;
  background: var(--surface); overflow: hidden;
}
.buret-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; transition: width 0.5s ease; }
.buret-ans { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); width: 0; transition: width 0.5s ease; }
.buret-tube::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--tick) calc(10% - 1px) 10%) bottom / 100% 45% no-repeat,
    repeating-linear-gradient(90deg, transparent 0 calc(2% - 1px), var(--tick) calc(2% - 1px) 2%) bottom / 100% 22% no-repeat;
}
.buret-legend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: var(--s-1); color: var(--muted); }
.buret-legend .mono { color: var(--ink); }

/* overview */
.stats { display: flex; flex-wrap: wrap; gap: 12px 32px; }
.stat { display: grid; }
.stat b { font-family: var(--f-mono); font-size: var(--s3); font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: var(--s-1); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card {
  display: grid; gap: 10px; align-content: start; padding: 14px 16px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  text-decoration: none; color: var(--ink);
}
a.card:hover { border-color: var(--accent); }
.card .n { font-family: var(--f-mono); font-size: var(--s-1); color: var(--muted); }
.card h3 { font-size: var(--s1); font-weight: 600; }
.card .buret-tube { height: 10px; }

.panel { display: grid; gap: 14px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel h2 { font-size: var(--s2); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 11px;
  font-size: var(--s-1); cursor: pointer; font-family: var(--f-mono);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.btn {
  border: 1.5px solid var(--ink); background: var(--surface); border-radius: var(--r);
  padding: 7px 14px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); display: inline-block;
}
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: var(--line); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* key ideas */
details.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.notes > summary {
  cursor: pointer; padding: 14px 20px; font-family: var(--f-display); font-size: var(--s1); font-weight: 600;
  list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
details.notes > summary::-webkit-details-marker { display: none; }
details.notes > summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); }
details.notes[open] > summary::after { content: "−"; }
.notes-body { padding: 0 20px 18px; display: grid; gap: 16px; }
.notes-body ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.notes-body li { max-width: 66ch; }
.eqs { display: grid; gap: 6px; }
.eqs h3, .notes-body h3 { font-family: var(--f-mono); font-size: var(--s-1); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.eq {
  font-family: var(--f-mono); font-size: 0.9375rem; background: var(--sunk); border-radius: 4px;
  padding: 8px 12px; overflow-x: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px;
}
.eq small { font-family: var(--f-body); color: var(--muted); font-size: var(--s-1); }

/* questions */
.qlist { display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 20px 18px; display: grid; gap: 12px; }
.q.is-ok { border-color: var(--ok); }
.q.is-bad { border-color: var(--bad); }
.q-top { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: var(--s-1); color: var(--muted); }
.q-kind { letter-spacing: 0.06em; text-transform: uppercase; }
.q-text { font-size: 1.0625rem; max-width: 66ch; }
.opts { display: grid; gap: 6px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r);
  padding: 9px 12px; cursor: pointer; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 6px; align-items: baseline;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--f-mono); color: var(--muted); font-size: var(--s-1); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.num { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.num input {
  width: 12em; max-width: 100%; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--bg); font-family: var(--f-mono);
}
.num input:focus { border-color: var(--accent); outline: none; }
.num .unit { font-family: var(--f-mono); color: var(--muted); }
.hint { font-size: var(--s-1); color: var(--muted); }
.err { font-size: var(--s-1); color: var(--bad); }
.fb { border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb .verdict { font-weight: 600; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.fb .why { max-width: 66ch; }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.confirm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--s-1); }
.result { font-family: var(--f-display); font-size: var(--s2); }
footer { font-size: var(--s-1); color: var(--muted); max-width: 66ch; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 16px; }
  .rail { position: static; }
  .chlist { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; }
  .chlink { grid-template-columns: auto auto; white-space: nowrap; border: 1px solid var(--line); }
  .chlink .t { display: none; }
  .head h1 { font-size: var(--s3); }
}
@media (prefers-reduced-motion: reduce) {
  .buret-fill, .buret-ans { transition: none; }
}
</style>

<div class="shell">
  <nav class="rail" aria-label="Chapters">
    <a class="brand" href="#overview"><b>Quant Review</b><span>Chapters 0–12 · quizzes &amp; key ideas</span></a>
    <ul class="chlist" id="chlist"></ul>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   CONTENT
   q.t: "mc" (multiple choice, a = index of correct option)
        "num" (numeric, a = value, tol = absolute tolerance or rel = relative tolerance,
               show = answer as displayed, unit = unit label)
   All questions and summaries are original review material.
   ============================================================ */
const CH = [
{
  n: 0, title: "The Analytical Process",
  ideas: [
    "<b>Qualitative</b> analysis finds out <i>what</i> is present; <b>quantitative</b> analysis finds out <i>how much</i>.",
    "A typical analysis runs: formulate the question → choose a procedure → collect a representative sample → prepare the sample → analyze replicates against a calibration → report and interpret → draw conclusions.",
    "A <b>bulk sample</b> is reduced to a homogeneous <b>laboratory sample</b>; an <b>aliquot</b> is the measured portion actually analyzed.",
    "Heterogeneous material can be <b>random</b> or <b>segregated</b>. A <b>composite sample</b> combines portions from different regions so the result represents the whole.",
    "An <b>interference</b> responds like the analyte or changes its signal. A <b>masking agent</b> ties up an interfering species so it no longer responds.",
    "A <b>calibration curve</b> relates instrument response to known concentrations so an unknown can be read from its signal."
  ],
  eqs: [ ["signal = m·[analyte] + b", "Linear calibration: read [analyte] = (signal − b)/m"] ],
  qs: [
    { t:"mc", q:"A lab is asked to find the mass of lead in each gram of a soil sample. What kind of analysis is this?",
      o:["Qualitative","Quantitative","Gravimetric only","Speciation only"], a:1,
      why:"Measuring <i>how much</i> lead is present is quantitative. Knowing only whether lead is present would be qualitative." },
    { t:"mc", q:"What is an <b>aliquot</b>?",
      o:["The entire bulk material that was sampled","A blank solution with no analyte","A measured portion of the laboratory sample taken for analysis","A reference material with certified composition"], a:2,
      why:"An aliquot is a precisely measured portion (for example, a 25.00 mL pipet volume) taken from the prepared laboratory sample." },
    { t:"mc", q:"Which step should come <b>first</b> in a well-planned chemical analysis?",
      o:["Choosing an instrument","Calibrating the balance","Collecting the sample","Formulating the question the analysis must answer"], a:3,
      why:"The question determines which analytes, detection limits and sampling plan you need. Everything else follows from it." },
    { t:"mc", q:"A grain silo has layers of wheat harvested from different fields. Why would you combine scoops taken at many depths?",
      o:["To make a composite sample that represents a segregated material","To increase the analyte concentration","To remove interferences","To make the sample dissolve faster"], a:0,
      why:"Layered material is <b>segregated heterogeneous</b>. Combining portions from each region in proportion gives a composite sample that represents the whole silo." },
    { t:"mc", q:"Fluoride is added to a sample so that Fe<sup>3+</sup> forms a stable complex and no longer reacts with the reagent used to measure Al<sup>3+</sup>. The fluoride is acting as a…",
      o:["Titrant","Masking agent","Internal standard","Primary standard"], a:1,
      why:"A masking agent selectively binds an interfering species so it stops contributing to (or disturbing) the analyte's signal." },
    { t:"num", q:"A calibration line is <span class=\"mono\">A = 0.0452·C + 0.003</span>, with C in µg/mL. An unknown gives absorbance 0.364. What is its concentration?",
      a:7.987, tol:0.02, show:"7.99 µg/mL", unit:"µg/mL",
      why:"C = (A − b)/m = (0.364 − 0.003)/0.0452 = 0.361/0.0452 = <b>7.99 µg/mL</b>." },
    { t:"mc", q:"Why do analysts run <b>replicate</b> measurements on several aliquots?",
      o:["To remove systematic error","To estimate the precision (random variation) of the result","Because instruments require warm-up","To avoid needing a calibration curve"], a:1,
      why:"Replicates show how much results scatter, which estimates random error. They cannot reveal a bias that affects every replicate equally." },
    { t:"mc", q:"Which activity belongs to <b>sample preparation</b>?",
      o:["Choosing which lake to sample","Dissolving a rock in acid and removing interfering ions","Writing the final report","Plotting the calibration curve"], a:1,
      why:"Sample preparation converts the representative sample into a form suitable for measurement: dissolving, concentrating, removing or masking interferences." }
  ]
},
{
  n: 1, title: "Chemical Measurements",
  ideas: [
    "SI prefixes used constantly: k = 10<sup>3</sup>, m = 10<sup>−3</sup>, µ = 10<sup>−6</sup>, n = 10<sup>−9</sup>, p = 10<sup>−12</sup>, f = 10<sup>−15</sup>.",
    "<b>Molarity</b> (M) is moles of solute per liter of <i>solution</i>. <b>Molality</b> (m) is moles of solute per kilogram of <i>solvent</i>, so it does not change with temperature.",
    "<b>Formal concentration</b> (F) counts a substance as it was formulated, whether or not it dissociates in solution.",
    "Weight percent, volume percent, ppm (×10<sup>6</sup>) and ppb (×10<sup>9</sup>) are mass or volume ratios. In dilute water, 1 ppm ≈ 1 µg/mL = 1 mg/L.",
    "Dilution conserves moles of solute: M<sub>conc</sub>·V<sub>conc</sub> = M<sub>dil</sub>·V<sub>dil</sub>.",
    "Gravimetric calculations convert the mass of a weighed product to the mass of analyte using formula masses and mole ratios."
  ],
  eqs: [
    ["M = mol solute / L solution", ""],
    ["ppm = (mass analyte / mass sample) × 10⁶", ""],
    ["M_conc · V_conc = M_dil · V_dil", "Moles before dilution = moles after"],
    ["M = (density g/mL × 1000 mL/L × wt fraction) / FM", "Molarity of a concentrated reagent"]
  ],
  qs: [
    { t:"num", q:"What mass of NaCl (FM 58.44 g/mol) is needed to make 250.0 mL of 0.1500 M NaCl?",
      a:2.1915, tol:0.002, show:"2.192 g", unit:"g",
      why:"mol = 0.1500 mol/L × 0.2500 L = 0.03750 mol. Mass = 0.03750 × 58.44 = <b>2.192 g</b>." },
    { t:"num", q:"10.00 mL of 0.500 M HNO<sub>3</sub> is diluted to 250.0 mL. What is the new concentration?",
      a:0.0200, tol:0.0002, show:"0.0200 M", unit:"M",
      why:"M<sub>dil</sub> = (0.500 M)(10.00 mL)/(250.0 mL) = <b>0.0200 M</b>." },
    { t:"num", q:"Concentrated HCl is 37.0 wt% HCl with a density of 1.18 g/mL. What is its molarity? (FM HCl = 36.46)",
      a:11.97, tol:0.1, show:"12.0 M", unit:"M",
      why:"1 L weighs 1180 g, of which 0.370 × 1180 = 436.6 g is HCl. 436.6 g ÷ 36.46 g/mol = <b>12.0 M</b>." },
    { t:"mc", q:"Why is molality sometimes preferred over molarity for precise physical measurements?",
      o:["It is easier to measure volumes than masses","It does not change when temperature changes","It is always numerically larger","It includes the activity coefficient"], a:1,
      why:"Molality is based on masses, which don't change with temperature. Solution volume expands on warming, so molarity drifts." },
    { t:"num", q:"2.5 mg of a pesticide is dissolved in 500 g of water. What is its concentration in ppm (by mass)?",
      a:5.0, tol:0.05, show:"5.0 ppm", unit:"ppm",
      why:"ppm = (2.5 × 10<sup>−3</sup> g / 500 g) × 10<sup>6</sup> = <b>5.0 ppm</b>." },
    { t:"num", q:"Tap water contains 5.0 ppm Fe (atomic mass 55.845). Express this as molarity. (Treat 1 ppm as 1 mg/L.) Enter scientific notation like <span class=\"mono\">1.2e-5</span>.",
      a:8.95e-5, rel:0.02, show:"8.95 × 10⁻⁵ M", unit:"M",
      why:"5.0 mg/L ÷ 55 845 mg/mol = <b>8.95 × 10<sup>−5</sup> M</b>." },
    { t:"num", q:"A 0.2500 g sample is dissolved and all its chloride precipitated as AgCl (FM 143.32), which weighs 0.4352 g. What is the weight percent Cl (35.453) in the sample?",
      a:43.06, tol:0.06, show:"43.06 %", unit:"wt %",
      why:"Mass Cl = 0.4352 g × (35.453/143.32) = 0.10765 g. Wt% = 0.10765/0.2500 × 100 = <b>43.06%</b>." },
    { t:"mc", q:"0.10 F acetic acid is partly dissociated in water. What does “0.10 F” tell you?",
      o:["[CH<sub>3</sub>CO<sub>2</sub>H] at equilibrium is exactly 0.10 M","[CH<sub>3</sub>CO<sub>2</sub><sup>−</sup>] is 0.10 M","0.10 mol of acetic acid was dissolved per liter, regardless of how it dissociates","The solution has 0.10 mol of acid per kilogram of water"], a:2,
      why:"Formal concentration counts the total as formulated. At equilibrium [HA] + [A<sup>−</sup>] = 0.10 M, and neither one alone equals 0.10 M." },
    { t:"mc", q:"Which quantity equals 10<sup>−6</sup> L?",
      o:["1 nL","1 mL","1 µL","1 pL"], a:2,
      why:"The prefix micro (µ) means 10<sup>−6</sup>, so 1 µL = 10<sup>−6</sup> L." }
  ]
},
{
  n: 2, title: "Tools of the Trade",
  ideas: [
    "Handle chemicals safely and ethically: know the hazards (safety data sheets), work in a hood when needed, and minimize and correctly dispose of waste.",
    "A lab notebook is bound and written in ink. Record what you did and what you observed, clearly enough for a stranger to repeat it. Cross out errors with one line and never remove pages.",
    "Air buoyancy makes objects appear lighter than they are. The correction is largest for low-density objects, such as water and organic liquids.",
    "Read a buret at the bottom of the meniscus with your eye level to it (to avoid parallax), and estimate to 0.01 mL.",
    "Volumetric flasks are calibrated <b>to contain</b> (TC); transfer pipets are calibrated <b>to deliver</b> (TD). Never heat volumetric glassware, because it may not return to its calibrated volume.",
    "Calibrate glassware by weighing the water it contains or delivers and converting mass to volume with the density of water at that temperature.",
    "Dry reagents and precipitates to <b>constant mass</b> (repeated heating and weighing until the mass stops changing) and store them in a desiccator."
  ],
  eqs: [
    ["m = m′ (1 − dₐ/d_w) / (1 − dₐ/d)", "m′ = balance reading, dₐ ≈ 0.0012 g/mL (air), d_w ≈ 8.0 g/mL (weights), d = object density"],
    ["V = m_water × (mL per g at T)", "Glassware calibration"]
  ],
  qs: [
    { t:"mc", q:"For which object is the buoyancy correction <b>largest</b> when weighed on a balance with 8.0 g/mL steel weights?",

{

  ideas: [
    "<b>Significant figures</b> are the digits needed to write a value in scientific notation without losing precision. The last one is uncertain.",
    "Addition/subtraction: keep the decimal place of the least precise number. Multiplication/division: keep the number of sig figs of the least precise factor.",
    "For logarithms, the digits after the decimal point (the mantissa) equal the sig figs in the original number. Antilogs reverse this rule.",
    "<b>Systematic</b> (determinate) error is a reproducible bias that can, in principle, be found and corrected. <b>Random</b> (indeterminate) error is always present and is equally likely to be + or −.",
    "<b>Accuracy</b> is closeness to the true value; <b>precision</b> is reproducibility.",
    "Uncertainties propagate: absolute uncertainties combine in quadrature for + and −; relative uncertainties combine in quadrature for × and ÷.",
    "Keep extra (guard) digits through a calculation and round only at the end."
  ],
  eqs: [
    ["y = x₁ ± x₂  →  e_y = √(e₁² + e₂²)", "Absolute uncertainties"],
    ["y = x₁·x₂ or x₁/x₂  →  %e_y = √(%e₁² + %e₂²)", "Relative uncertainties"],
    ["y = xᵃ  →  %e_y = a·%e_x", ""],
    ["y = log x  →  e_y = 0.43429·(e_x/x)", "y = 10ˣ  →  e_y/y = 2.3026·e_x"]

    { t:"mc", q:"Express <span class=\"mono\">log(4.37 × 10<sup>−3</sup>)</span> with the correct number of digits.",
      o:["−2.36","−2.360","−2.3595","−2.4"], a:1,

    { t:"mc", q:"A pipet consistently delivers 0.02 mL more than its nominal volume. This produces…",

{

    ["G = |x_q − x̄| / s", "Reject if G_calc > G_table"],

{
  n: 5, title: "Quality Assurance and Calibration Methods",
  ideas: [
    "Quality assurance starts from <b>use objectives</b> (why the data are needed), sets <b>specifications</b> (required accuracy, precision, detection limit), and uses <b>assessment</b> to show they were met.",
    "Blanks find contamination: a <b>method blank</b> goes through every step, a <b>reagent blank</b> leaves out the sample, and a <b>field blank</b> travels to the sampling site and back.",
    "A <b>spike</b> (a known addition of analyte) tests recovery. A <b>control chart</b> tracks a standard over time with warning lines (±2σ) and action lines (±3σ).",

    "Detection limit ≈ 3s/m and quantitation limit ≈ 10s/m, where s is the standard deviation of low-concentration samples and m is the calibration slope.",
    "<b>Standard addition</b> corrects for matrix effects by adding known amounts of analyte to the sample itself. An <b>internal standard</b> (a different compound added in known amount) corrects for variations in volume or instrument response."
  ],
  eqs: [
    ["% recovery = (C_spiked − C_unspiked)/C_added × 100", ""],
    ["LOD = 3s/m     LOQ = 10s/m", "Concentration limits"],
    ["[X]ᵢ / ([S]_f + [X]_f) = I_X / I_(S+X)", "Standard addition"],
    ["A_X/[X] = F · (A_S/[S])", "Internal standard, response factor F"]
  ],
  qs: [
    { t:"num", q:"An unspiked water sample measures 10.0 µg/L lead. After a spike adds 20.0 µg/L, the sample measures 28.6 µg/L. What is the spike recovery?",
      a:93, tol:0.6, show:"93 %", unit:"%",
      why:"Recovery = (28.6 − 10.0)/20.0 × 100 = <b>93%</b>." },
    { t:"num", q:"Replicate low-concentration standards have s = 0.0020 absorbance units. The calibration slope is 0.0450 absorbance/ppm. What is the detection limit?",

    { t:"mc", q:"With the same data (s = 0.0020, m = 0.0450 per ppm), what is the lower limit of quantitation?",

      why:"LOQ = 10s/m = 10(0.0020)/0.0450 = <b>0.44 ppm</b>, which is about 3.3 times the detection limit." },
    { t:"mc", q:"When is <b>standard addition</b> the best calibration choice?",

    { t:"num", q:"An unknown gives a signal of 0.300. Adding standard raises the analyte concentration by 5.00 ppm (assume negligible volume change), and the signal becomes 0.500. What was the original concentration?",

    { t:"num", q:"A standard mixture has [X] = 0.0400 M and [S] = 0.0500 M with peak areas A<sub>X</sub> = 300 and A<sub>S</sub> = 400. An unknown is spiked so [S] = 0.0250 M, giving A<sub>X</sub> = 250 and A<sub>S</sub> = 210. Find [X] in the unknown.",

    { t:"mc", q:"On a control chart, one result falls outside the ±3σ action line. What should happen?",

    { t:"mc", q:"Which blank reveals contamination picked up during sample collection, transport and storage?",

    { t:"mc", q:"A method's ability to measure the analyte without response from other species in the sample is its…",

  ]

    "<b>Direct</b> titration adds titrant to analyte. <b>Back</b> titration adds a known excess of reagent, then titrates what is left over. <b>Displacement</b> titration measures a species released by the analyte.",

    "End-point methods for Ag<sup>+</sup> titrations: <b>Volhard</b> (back-titrate excess Ag<sup>+</sup> with SCN<sup>−</sup> using Fe<sup>3+</sup> as indicator), <b>Fajans</b> (adsorption indicators) and <b>Mohr</b> (CrO<sub>4</sub><sup>2−</sup> forms red Ag<sub>2</sub>CrO<sub>4</sub>)."
  ],
  eqs: [

/* ============================================================
   STATE
   ============================================================ */
const KEY = "quant-review-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function rec(ch, i) { return (store[ch] || {})[i]; }
function setRec(ch, i, r) { (store[ch] = store[ch] || {})[i] = r; save(); }

let mixed = null;          // {items:[{ch,i}], recs:{}}
let mixSel = new Set(CH.map(c => c.n));
let pendingReset = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function chStats(c) {
  const r = store[c.n] || {}; let ok = 0, done = 0;
  c.qs.forEach((_, i) => { if (r[i]) { done++; if (r[i].c) ok++; } });
  return { ok, done, total: c.qs.length };
}
function allStats() {
  return CH.reduce((a, c) => { const s = chStats(c); a.ok += s.ok; a.done += s.done; a.total += s.total; return a; }, { ok:0, done:0, total:0 });
}

/* ============================================================
   NUMBERS
   ============================================================ */
const SUP = { "⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"-","⁺":"" };
function parseNum(raw) {
  let s = String(raw).trim();
  if (!s) return NaN;
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, ch => SUP[ch]);
  s = s.replace(/[−–—]/g, "-").replace(/,/g, "").replace(/\s+/g, "");
  s = s.replace(/^[±+]/, "");
  s = s.replace(/[x×*·]10\^?/i, "e").replace(/^10\^/, "1e");
  s = s.replace(/^(-?[\d.]+(?:e[-+]?\d+)?).*$/i, "$1");
  const v = Number(s);
  return Number.isFinite(v) ? v : NaN;
}
function numOK(q, v) {
  const tol = q.rel != null ? Math.abs(q.a) * q.rel : (q.tol != null ? q.tol : Math.abs(q.a) * 0.01);
  return Math.abs(v - q.a) <= tol + 1e-12;
}

/* ============================================================
   RENDERING
   ============================================================ */
function buret(ok, done, total, small) {
  const pOk = total ? (ok / total) * 100 : 0, pDone = total ? (done / total) * 100 : 0;
  return `<div class="buret">
    <div class="buret-tube" role="img" aria-label="${ok} of ${total} correct, ${done} answered">
      <div class="buret-ans" style="width:${pDone}%"></div><div class="buret-fill" style="width:${pOk}%"></div>
    </div>
    ${small ? "" : `<div class="buret-legend"><span><span class="mono">${ok}</span> correct · <span class="mono">${done}</span> of <span class="mono">${total}</span> answered</span><span>${done ? `<span class="mono">${Math.round(ok / done * 100)}%</span> accuracy so far` : "Not started"}</span></div>`}
  </div>`;
}

function renderNav(active) {
  $("#chlist").innerHTML = CH.map(c => {
    const s = chStats(c);
    return `<li><a class="chlink" href="#ch${c.n}" ${active === c.n ? 'aria-current="page"' : ""}>
      <span class="n">${c.n}</span><span class="t">${c.title}</span>
      <span class="sc ${s.ok === s.total ? "full" : ""}">${s.done ? `${s.ok}/${s.total}` : "–"}</span></a></li>`;
  }).join("");
}

function qCard(q, idx, r, key) {
  const kind = q.t === "mc" ? "Multiple choice" : "Calculation";
  let body = "";
  if (q.t === "mc") {
    body = `<div class="opts">` + q.o.map((o, j) => {
      let cls = "";
      if (r) { if (j === q.a) cls = "right"; else if (j === r.r) cls = "wrong"; }
      return `<button type="button" class="opt ${cls}" data-key="${key}" data-opt="${j}" ${r ? "disabled" : ""}>
        <span class="k">${"ABCDEFG"[j]}</span><span>${o}</span></button>`;
    }).join("") + `</div>`;
  } else {
    body = `<form class="num" data-key="${key}" novalidate>
        <input id="in-${key}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
          aria-label="Your answer" placeholder="e.g. 2.19 or 1.5e-4" ${r ? `value="${esc(r.r)}" disabled` : ""}>
        ${q.unit ? `<span class="unit">${q.unit}</span>` : ""}
        ${r ? "" : `<button class="btn" type="submit">Check</button>`}
      </form>
      ${r ? "" : `<div class="err" id="err-${key}" hidden></div>`}`;
  }
  let fb = "";
  if (r) {
    const ans = q.t === "mc" ? `${"ABCDEFG"[q.a]}` : esc(q.show);
    fb = `<div class="fb ${r.c ? "ok" : "bad"}" role="status">
      <div class="verdict">${r.c ? "Correct" : `Not quite. Answer: ${ans}`}</div>
      <div class="why">${q.why}</div></div>`;
  }
  return `<article class="q ${r ? (r.c ? "is-ok" : "is-bad") : ""}" id="q-${key}">
    <div class="q-top"><span>Q${idx + 1}</span><span class="q-kind">${kind}</span></div>
    <div class="q-text">${q.q}</div>${body}${fb}</article>`;
}

function notes(c) {
  return `<details class="notes" open>
    <summary>Key ideas</summary>
    <div class="notes-body">
      <ul>${c.ideas.map(i => `<li>${i}</li>`).join("")}</ul>
      ${c.eqs.length ? `<div class="eqs"><h3>Key relationships</h3>${c.eqs.map(([e, s]) => `<div class="eq"><span>${e}</span>${s ? `<small>${s}</small>` : ""}</div>`).join("")}</div>` : ""}
    </div></details>`;
}

function renderChapter(n) {
  const c = CH.find(x => x.n === n);
  const s = chStats(c);
  const prev = CH.find(x => x.n === n - 1), next = CH.find(x => x.n === n + 1);
  const resetUI = pendingReset === n
    ? `<span class="confirm">Clear your ${s.done} answers here?
         <button class="btn primary" type="button" data-act="reset-yes">Clear answers</button>
         <button class="btn quiet" type="button" data-act="reset-no">Keep them</button></span>`
    : `<button class="btn quiet" type="button" data-act="reset" ${s.done ? "" : "disabled"}>Retake chapter</button>`;
  $("#main").innerHTML = `
    <header class="head">
      <div class="eyebrow">Chapter ${c.n}</div>
      <h1>${c.title}</h1>
      ${buret(s.ok, s.done, s.total)}
    </header>
    ${notes(c)}
    <section class="qlist" aria-label="Quiz">${c.qs.map((q, i) => qCard(q, i, rec(n, i), `${n}-${i}`)).join("")}</section>
    <div class="row">${resetUI}</div>
    <nav class="pager" aria-label="Chapter navigation">
      ${prev ? `<a class="btn quiet" href="#ch${prev.n}">← Ch ${prev.n}: ${prev.title}</a>` : `<a class="btn quiet" href="#overview">← Overview</a>`}
      ${next ? `<a class="btn" href="#ch${next.n}">Ch ${next.n}: ${next.title} →</a>` : `<a class="btn" href="#mixed">Mixed review →</a>`}
    </nav>`;
}

function renderOverview() {
  const a = allStats();
  $("#main").innerHTML = `
    <header class="head">
      <div class="eyebrow">Chapters 0–12</div>
      <h1>Review the measurement and equilibrium chapters</h1>
      <p class="lede">Each chapter has a short summary of key ideas and relationships, followed by a quiz of concept checks and worked calculations. You get feedback and an explanation after every answer. Progress is saved in this browser.</p>
    </header>
    <div class="stats">
      <div class="stat"><b>${a.ok}<span class="mono" style="font-size:var(--s1);color:var(--muted)">/${a.total}</span></b><span>correct</span></div>
      <div class="stat"><b>${a.done}</b><span>answered</span></div>
      <div class="stat"><b>${a.done ? Math.round(a.ok / a.done * 100) + "%" : "–"}</b><span>accuracy</span></div>
    </div>
    ${buret(a.ok, a.done, a.total, true)}
    <section class="panel" aria-labelledby="mixh">
      <h2 id="mixh">Mixed review</h2>
      <p class="lede">Draw 10 random questions from the chapters you choose. Mixed sessions don't change your chapter scores.</p>
      <div class="chips" role="group" aria-label="Chapters to include">
        ${CH.map(c => `<button type="button" class="chip" data-mix="${c.n}" aria-pressed="${mixSel.has(c.n)}" title="${c.title}">Ch ${c.n}</button>`).join("")}
      </div>
      <div class="row">
        <button class="btn primary" type="button" data-act="mix-start" ${mixSel.size ? "" : "disabled"}>Start 10 questions</button>
        <button class="btn quiet" type="button" data-act="mix-all">Select all</button>
        <button class="btn quiet" type="button" data-act="mix-none">Clear</button>
      </div>
    </section>
    <section class="grid" aria-label="Chapters">
      ${CH.map(c => { const s = chStats(c); return `<a class="card" href="#ch${c.n}">
        <span class="n">Chapter ${c.n} · ${s.total} questions</span><h3>${c.title}</h3>${buret(s.ok, s.done, s.total, true)}
        <span class="n">${s.done ? `${s.ok}/${s.total} correct` : "Not started"}</span></a>`; }).join("")}
    </section>
    <footer>Questions and summaries are original review material, organized to follow the chapter sequence of Harris &amp; Lucy, <i>Quantitative Chemical Analysis</i>, 9th ed. Assume 25 °C unless a problem says otherwise. Numeric answers accept a small rounding tolerance.</footer>`;
}

function startMixed() {
  const pool = [];
  CH.forEach(c => { if (mixSel.has(c.n)) c.qs.forEach((_, i) => pool.push({ ch: c.n, i })); });
  for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
  mixed = { items: pool.slice(0, 10), recs: {} };
}

function renderMixed() {
  if (!mixed) startMixed();
  const n = mixed.items.length, done = Object.keys(mixed.recs).length;
  const ok = Object.values(mixed.recs).filter(r => r.c).length;
  $("#main").innerHTML = `
    <header class="head">
      <div class="eyebrow">Mixed review</div>
      <h1>${n} questions from ${[...new Set(mixed.items.map(x => x.ch))].sort((a, b) => a - b).map(x => "Ch " + x).join(", ")}</h1>
      ${buret(ok, done, n)}
    </header>
    <section class="qlist" aria-label="Mixed quiz">
      ${mixed.items.map((it, k) => {
        const c = CH.find(x => x.n === it.ch);
        return qCard(c.qs[it.i], k, mixed.recs[k], `m-${k}`).replace('<span class="q-kind">', `<span class="q-kind">Ch ${c.n} · `);
      }).join("")}
    </section>
    ${done === n ? `<div class="panel"><p class="result">You scored ${ok} of ${n}.</p>
      <p class="lede">${ok === n ? "Every one correct." : "Review the explanations above, then reread the key ideas for the chapters where you missed questions."}</p></div>` : ""}
    <div class="row">
      <button class="btn primary" type="button" data-act="mix-new">New set of 10</button>
      <a class="btn quiet" href="#overview">Change chapters</a>
    </div>`;
}

/* ============================================================
   ANSWERING
   ============================================================ */
function lookup(key) {
  if (key.startsWith("m-")) {
    const k = +key.slice(2), it = mixed.items[k];
    return { q: CH.find(x => x.n === it.ch).qs[it.i], save: r => { mixed.recs[k] = r; }, idx: k };
  }
  const [ch, i] = key.split("-").map(Number);
  return { q: CH.find(x => x.n === ch).qs[i], save: r => setRec(ch, i, r), idx: i, ch };
}

function answered(key) {
  const L = lookup(key);
  const r = key.startsWith("m-") ? mixed.recs[L.idx] : rec(L.ch, L.idx);
  const el = document.getElementById("q-" + key);
  el.outerHTML = qCard(L.q, L.idx, r, key).replace('<span class="q-kind">',
    key.startsWith("m-") ? `<span class="q-kind">Ch ${mixed.items[L.idx].ch} · ` : '<span class="q-kind">');
  // refresh meters without re-rendering the list
  const view = route();
  if (view.type === "ch") {
    const c = CH.find(x => x.n === view.n), s = chStats(c);
    document.querySelector(".head .buret").outerHTML = buret(s.ok, s.done, s.total);
    renderNav(view.n);
    const rb = document.querySelector('[data-act="reset"]'); if (rb) rb.disabled = !s.done;
  } else if (view.type === "mixed") {
    const n = mixed.items.length, done = Object.keys(mixed.recs).length;
    if (done === n) { const y = window.scrollY; renderMixed(); window.scrollTo(0, y); }
    else { const ok = Object.values(mixed.recs).filter(r => r.c).length; document.querySelector(".head .buret").outerHTML = buret(ok, done, n); }
  }
  const fb = document.querySelector(`#q-${CSS.escape(key)} .fb`);
  if (fb) fb.setAttribute("tabindex", "-1");
}

document.addEventListener("click", e => {
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const key = opt.dataset.key, j = +opt.dataset.opt, L = lookup(key);
    L.save({ c: j === L.q.a, r: j });
    answered(key);
    return;
  }
  const chip = e.target.closest("[data-mix]");
  if (chip) {
    const n = +chip.dataset.mix;
    mixSel.has(n) ? mixSel.delete(n) : mixSel.add(n);
    chip.setAttribute("aria-pressed", mixSel.has(n));
    $('[data-act="mix-start"]').disabled = !mixSel.size;
    return;
  }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act, view = route();
  if (a === "mix-start" || a === "mix-new") {
    startMixed();
    if (location.hash === "#mixed") { renderMixed(); window.scrollTo(0, 0); } else location.hash = "mixed";
  } else if (a === "mix-all" || a === "mix-none") {
    mixSel = a === "mix-all" ? new Set(CH.map(c => c.n)) : new Set();
    renderOverview();
  } else if (a === "reset") { pendingReset = view.n; renderChapter(view.n); $('[data-act="reset-no"]').focus(); }
  else if (a === "reset-no") { pendingReset = null; renderChapter(view.n); }
  else if (a === "reset-yes") {
    delete store[view.n]; save(); pendingReset = null;
    renderChapter(view.n); renderNav(view.n); window.scrollTo(0, 0);
  }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form.num");
  if (!f) return;
  e.preventDefault();
  const key = f.dataset.key, L = lookup(key);
  const input = document.getElementById("in-" + key), raw = input.value;
  const v = parseNum(raw);
  const err = document.getElementById("err-" + key);
  if (Number.isNaN(v)) {
    err.textContent = "Enter a number, such as 0.0250 or 8.95e-5 (units are optional).";
    err.hidden = false; input.focus(); return;
  }
  L.save({ c: numOK(L.q, v), r: raw.trim() });
  answered(key);
});

/* ============================================================
   ROUTING
   ============================================================ */
function route() {
  const h = location.hash.replace("#", "");
  const m = /^ch(\d{1,2})$/.exec(h);
  if (m && CH.some(c => c.n === +m[1])) return { type: "ch", n: +m[1] };
  if (h === "mixed") return { type: "mixed" };
  return { type: "overview" };
}
function show() {
  const v = route();
  pendingReset = null;
  if (v.type === "ch") { renderChapter(v.n); renderNav(v.n); }
  else if (v.type === "mixed") { renderMixed(); renderNav(-1); }
  else { renderOverview(); renderNav(-1); }
  document.title = v.type === "ch" ? `Ch ${v.n} · Quantitative Analysis Review` : "Quantitative Analysis Review";
}
window.addEventListener("hashchange", () => { show(); window.scrollTo(0, 0); });
show();
</script>
